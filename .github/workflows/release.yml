name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to GitHub Packages.'
        required: true
        type: boolean
        default: false
      version-name:
        description: 'Version name.'
        required: false
        type: string
      release-body:
        description: 'Release notes.'
        required: false
        type: string

jobs:
  publish:
    if: ${{ github.event.inputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version-file: '.github/workflows/.java-version'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish to GitHub Packages
        run: ./gradlew publish --no-daemon --stacktrace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

  release:
    permissions:
      contents: write
    if: ${{ github.event.inputs.publish == 'false' || success() }}
    needs: [publish]
    uses: jenly1314/actions/.github/workflows/reusable-release.yml@v1
    with:
      version-name: ${{ github.event.inputs.version-name }}
      release-body: ${{ github.event.inputs.release-body }}

  docs:
    permissions:
      contents: write
      id-token: write
      pages: write
    needs: [release]
    uses: jenly1314/actions/.github/workflows/reusable-docs.yml@v1
    with:
      java-version-file: '.github/workflows/.java-version'
